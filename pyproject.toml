[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cammcat"
version = "0.1.0"
dependencies = [
  "pydantic",
  "pytest",
  "pyyaml",
  "pyscicat@git+https://github.com/SciCatProject/pyscicat.git@c4e21ee90a2ace1cc9bad800a201b2e3cab28c5b"
]
requires-python = ">=3.14"
authors = [
  {name = "John Miller", email = "jmill165@tennessee.edu"},
]
maintainers = [
  {name = "John Miller", email = "jmill165@tennessee.edu"},
]
description = "CAMM SciCat"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
cammcat = "cammcat.cli:cli"
